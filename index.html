
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  font-family: Arial, sans-serif;
}

#games {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  padding: 12px;
}

#games button, #back {
  background: #222;
  color: white;
  border: 1px solid #444;
  padding: 14px 20px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 15px;
}

#games button:hover, #back:hover {
  background: #444;
}

#player {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: black;
}

#game {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

#back {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 10;
  background: #222;
}
</style>
</head>

<body>

<div id="games"></div>

<div id="player">
  <button id="back" onclick="goBack()">Back</button>
  <iframe id="game" allow="fullscreen; autoplay; gamepad"></iframe>
</div>

<script>
const API =
"https://api.github.com/repos/CoolDude2349/Offline-HTML-Games-Pack/contents/offline?ref=master";

const RAW =
"https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/";

const games = document.getElementById("games");
const player = document.getElementById("player");
const frame = document.getElementById("game");

async function loadGames() {
  try {
    const response = await fetch(API);

    if (!response.ok) {
      throw new Error("Could not load games");
    }

    const files = await response.json();

    const htmlFiles = files
      .filter(file =>
        file.type === "file" &&
        /\.(html|htm)$/i.test(file.name)
      )
      .sort((a, b) => a.name.localeCompare(b.name));

    htmlFiles.forEach(file => {
      const button = document.createElement("button");

      button.textContent = file.name.replace(/\.(html|htm)$/i, "");

      button.onclick = () => openGame(file.name);

      games.appendChild(button);
    });

  } catch (error) {
    console.error(error);
    games.textContent = "Games could not load. Refresh the page.";
  }
}

async function openGame(filename) {
  games.style.display = "none";
  player.style.display = "block";

  frame.srcdoc = "";

  try {
    const response = await fetch(
      RAW + encodeURIComponent(filename)
    );

    if (!response.ok) {
      throw new Error("Game failed to load");
    }

    let html = await response.text();

    const base = '<base href="' + RAW + '">';

    if (/<head[^>]*>/i.test(html)) {
      html = html.replace(/<head[^>]*>/i, match =>
        match + base
      );
    } else {
      html = base + html;
    }

    frame.srcdoc = html;

  } catch (error) {
    frame.srcdoc =
      "<body style='background:black;color:white;font-family:Arial;text-align:center;padding:30px'>" +
      "This game could not load. Please go back and try another game." +
      "</body>";
  }
}

function goBack() {
  frame.srcdoc = "";
  frame.src = "about:blank";
  player.style.display = "none";
  games.style.display = "flex";
}

loadGames();
</script>

</body>
</html>
